<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moon Relics Explorer</title>
<style>
:root{--ink:#f4efe6;--dim:#a9b2c8;--panel:rgba(14,18,38,.88);--accent:#ffb454;--line:rgba(255,255,255,.14);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:#070a1c;color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;overflow:hidden}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#hud{position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top,0px));right:12px;display:flex;justify-content:space-between;gap:10px;pointer-events:none}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
h1{font:700 17px/1.1 Georgia,serif;margin:0 0 4px}
.sm{font-size:12px;color:var(--dim);line-height:1.4}
#nav{pointer-events:auto;text-align:right;min-width:170px}
#arrow{width:46px;height:46px;margin:0 0 4px auto;display:block}
button{font:inherit;cursor:pointer;color:#1a1204;background:var(--accent);border:0;border-radius:999px;padding:8px 14px;font-weight:700}
button.g{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
#card{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,130%);width:min(460px,calc(100vw - 24px));transition:transform .35s cubic-bezier(.2,.9,.3,1);max-height:60vh;overflow:auto;z-index:5}
#card.on{transform:translate(-50%,0)}
#card h2{font:700 22px/1.15 Georgia,serif;margin:0 0 6px}
#card dl{margin:10px 0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
#card dt{color:var(--dim)}#card dd{margin:0}
#card p{margin:8px 0;font-size:14px;line-height:1.5}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
#hint{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);pointer-events:none;text-align:center;width:max-content;max-width:90vw}
#pad{position:fixed;left:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:none;grid-template-columns:repeat(3,52px);gap:6px}
#pad button{height:52px;padding:0;font-size:20px;background:var(--panel);color:var(--ink);border:1px solid var(--line)}
@media (pointer:coarse){#pad{display:grid}#hint{display:none}}
@media (max-width:560px){#hud{flex-direction:column}#nav{text-align:left}#arrow{margin:0 0 4px 0}}
</style>
</head>
<body>
<div id="hud">
  <div class="box"><h1>Moon Relics</h1><div class="sm" id="count">Visited 0</div></div>
  <div class="box" id="nav"><svg id="arrow" viewBox="-25 -25 50 50"><circle r="22" fill="none" stroke="rgba(255,255,255,.2)"/><path id="ap" d="M0-17 L9 10 L0 5 L-9 10Z" fill="#ffb454"/></svg><div class="sm" id="tgt">Pick a relic or press Next relic</div><div class="row" style="justify-content:flex-end;margin-top:6px"><button class="g" id="snd">Sound on</button><button id="next">Next relic</button></div></div>
</div>
<div class="box sm" id="hint">Drive with W A S D or arrow keys · Shift to boost · Click a relic to read its story</div>
<div id="pad"><span></span><button data-k="w" aria-label="Forward">&#9650;</button><span></span><button data-k="a" aria-label="Left">&#9664;</button><button data-k="s" aria-label="Back">&#9660;</button><button data-k="d" aria-label="Right">&#9654;</button></div>
<div class="box" id="card" role="dialog" aria-live="polite"></div>

{const g=new THREE.BufferGeometry(),p=[];for(let i=0;i<1400;i++){const u=Math.random()*2-1,t=Math.random()*6.283,r=Math.sqrt(1-u*u);p.push(r*Math.cos(t)*1200,u*1200,r*Math.sin(t)*1200)}

function initAudio(){if(AC){AC.resume();return}try{AC=new(window.AudioContext||window.webkitAudioContext)();M=AC.createGain();M.gain.value=muted?0:1;M.connect(AC.destination);eng=AC.createOscillator();eng.type='sawtooth';eng.frequency.value=40;engF=AC.createBiquadFilter();engF.type='lowpass';engF.frequency.value=150;engG=AC.createGain();engG.gain.value=0;eng.connect(engF);engF.connect(engG);engG.connect(M);eng.start();const dr=AC.createOscillator(),dgn=AC.createGain();dr.type='sine';dr.frequency.value=55;dgn.gain.value=.02;dr.connect(dgn);dgn.connect(M);dr.start()}catch(e){AC=null}}

const sb=document.getElementById('snd');sb.onclick=()=>{initAudio();muted=!muted;if(M)M.gain.value=muted?0:1;sb.textContent=muted?'Sound off':'Sound on'};
const card=document.getElementById('card'),tg=document.getElementById('tgt'),cnt=document.getElementById('count'),ap=document.getElementById('ap');
function setTarget(i){tgt=i;tg.textContent=i<0?'Pick a relic or press Next relic':'Heading to '+RELICS[i].n}
function updCount(){cnt.textContent='Visited '+items.filter(x=>x.seen).length+' of '+items.length+' relics'}updCount();
function show(i){const it=items[i],r=it.r;it.seen=true;updCount();
 const lat=Math.abs(r.lat).toFixed(2)+'\u00B0 '+(r.lat<0?'S':'N'),lon=Math.abs(r.lon).toFixed(2)+'\u00B0 '+(r.lon<0?'W':'E');
 card.innerHTML='<h2></h2><dl><dt>Left here</dt><dd class="a"></dd><dt>From</dt><dd class="b"></dd><dt>Where</dt><dd class="c"></dd><dt>Coordinates</dt><dd class="e"></dd><dt>Status</dt><dd class="f"></dd></dl><p class="t"></p><div class="row"><button id="go">Next relic</button><button class="g" id="x">Close</button></div>';
 const q=s=>card.querySelector(s);q('h2').textContent=r.n;q('.a').textContent=r.d;q('.b').textContent=r.who;q('.c').textContent=r.place;q('.e').textContent=lat+', '+lon;q('.f').textContent=r.st;q('.t').textContent=r.txt;
 card.classList.add('on');blip(523,.35);blip(659,.35,.09);blip(784,.5,.18);q('#x').onclick=()=>card.classList.remove('on');
 q('#go').onclick=()=>{card.classList.remove('on');setTarget((i+1)%items.length)}}
document.getElementById('next').onclick=()=>setTarget((tgt+1)%items.length);

const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown',e=>{mouse.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(mouse,cam);
 const h=ray.intersectObjects(clickables,true);if(h.length){show(h[0].object.userData.idx);setTarget(h[0].object.userData.idx)}});

function resize(){renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

const clock=new THREE.Clock(),camPos=new THREE.Vector3(),camUp=new THREE.Vector3(0,1,0),tmp=new THREE.Vector3();let first=true;
function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
 const boost=keys.shift?2.2:1,fw=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0),tr=(keys.a||keys.arrowleft?1:0)-(keys.d||keys.arrowright?1:0);
 speed+=(fw*16*boost-speed)*Math.min(1,dt*3);
 if(tr)H.applyQuaternion(new THREE.Quaternion().setFromAxisAngle(P,tr*dt*2*(speed<-.5?-1:1)));
 if(Math.abs(speed)>.01){const ax=new THREE.Vector3().crossVectors(P,H).normalize(),q=new THREE.Quaternion().setFromAxisAngle(ax,speed*dt/R);P.applyQuaternion(q).normalize();H.applyQuaternion(q);H.sub(P.clone().multiplyScalar(H.dot(P))).normalize()}
 orient(pl,P,H);
 const k=first?1:Math.min(1,dt*4);
 tmp.copy(P).multiplyScalar(R+10).addScaledVector(H,-17);camPos.lerp(tmp,k);camUp.lerp(P,k).normalize();first=false;
 cam.position.copy(camPos);cam.up.copy(camUp);cam.lookAt(P.clone().multiplyScalar(R+1).addScaledVector(H,5));
 items.forEach(it=>{it.orb.rotation.y=t*1.5;it.orb.position.y=11+Math.sin(t*2+it.i)*.5;it.beam.material.opacity=it.i===tgt?.65:(it.seen?.1:.3);it.orb.material.color.set(it.seen?0x9ad0a0:0xffd58a)});
 if(Math.abs(speed)>3){puff();puff()}
 for(let i=0;i<DN;i++){if(dage[i]>1.6){dpos[i*3]=dpos[i*3+1]=dpos[i*3+2]=0;continue}dage[i]+=dt;const v=dvel[i],x=dpos[i*3],y=dpos[i*3+1],z=dpos[i*3+2],l=Math.hypot(x,y,z)||1;v.x-=x/l*3*dt;v.y-=y/l*3*dt;v.z-=z/l*3*dt;if(l<R+.6)v.set(0,0,0);dpos[i*3]=x+v.x*dt;dpos[i*3+1]=y+v.y*dt;dpos[i*3+2]=z+v.z*dt;const c=.46+.4*Math.max(0,1-dage[i]/1.6);dcol[i*3]=c;dcol[i*3+1]=c*.97;dcol[i*3+2]=c*.93}
 dg.attributes.position.needsUpdate=true;dg.attributes.color.needsUpdate=true;
 if(AC){const s=Math.abs(speed),n=AC.currentTime;engG.gain.setTargetAtTime(Math.min(.05,s/16*.04),n,.1);eng.frequency.setTargetAtTime(40+s*2.2,n,.1);engF.frequency.setTargetAtTime(150+s*10,n,.1)}
 earth.rotation.y=t*.05;
 if(tgt>=0){const it=items[tgt],u=it.pos.clone().normalize(),to=u.sub(P.clone().multiplyScalar(u.dot(P))).normalize(),right=new THREE.Vector3().crossVectors(H,P),
  ang=Math.atan2(to.dot(right),to.dot(H));ap.setAttribute('transform','rotate('+(ang*180/Math.PI)+')');
  const d=Math.acos(Math.max(-1,Math.min(1,P.dot(it.pos.clone().normalize()))))*R;if(d<9&&arrived!==tgt){arrived=tgt;blip(784,.3);blip(988,.5,.12)}else if(d>=14&&arrived===tgt)arrived=-1;tg.textContent=d<9?'You are here. Click '+it.r.n:'Heading to '+it.r.n+' \u2013 '+Math.round(d)+' m'}
 renderer.render(scene,cam)}
loop();
setTimeout(()=>{const h=document.getElementById('hint');h.style.transition='opacity 1s';h.style.opacity=0},15000);
})();
</script>
</body>
